<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAMU/CRU · Transportes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        plugins: [
          function ({ addVariant }) {
            addVariant("light", [".theme-light &", ".theme-light&"]);
          },
        ],
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "Inter",
                "ui-sans-serif",
                "system-ui",
                "-apple-system",
                "Segoe UI",
                "Roboto",
                "sans-serif",
              ],
              mono: [
                "JetBrains Mono",
                "ui-monospace",
                "SFMono-Regular",
                "Menlo",
                "monospace",
              ],
            },
            colors: {
              ink: {
                0: "#0a0c10",
                50: "#0d1015",
                100: "#11151c",
                150: "#161b24",
                200: "#1c2230",
                300: "#252c3c",
                400: "#323a4d",
              },
            },
            keyframes: {
              "ping-slow": {
                "0%, 100%": { opacity: "1", transform: "scale(1)" },
                "50%": { opacity: "0.55", transform: "scale(1.02)" },
              },
              "card-pulse": {
                "0%, 100%": { opacity: "1" },
                "50%": { opacity: "0.82" },
              },
              shimmer: {
                "0%": { backgroundPosition: "200% 0" },
                "100%": { backgroundPosition: "-200% 0" },
              },
            },
            animation: {
              "ping-slow": "ping-slow 1.8s ease-in-out infinite",
              "card-pulse": "card-pulse 1.8s ease-in-out infinite",
              shimmer: "shimmer 2.4s linear infinite",
            },
          },
        },
      };
    </script>
    <style>
      html,
      body {
        background: #0a0c10;
        color: #d6dbe6;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        font-feature-settings: "cv11", "ss01", "ss03";
      }
      html.light,
      html.light body {
        background: #f5f6f8;
        color: #0f1318;
      }
      ::selection {
        background: #38bdf833;
      }
      /* slim scrollbars */
      *::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      *::-webkit-scrollbar-thumb {
        background: #ffffff14;
        border-radius: 8px;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: #ffffff22;
      }
      html.light *::-webkit-scrollbar-thumb {
        background: #0f131820;
      }
      .stripe-bg {
        background-image: repeating-linear-gradient(
          135deg,
          transparent 0 6px,
          rgba(148, 163, 184, 0.12) 6px 7px
        );
      }
      .focus-ring:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
        border-radius: 6px;
      }
      .grid-bg {
        background-image: radial-gradient(
          rgba(148, 163, 184, 0.07) 1px,
          transparent 1px
        );
        background-size: 22px 22px;
      }
      html.light .grid-bg {
        background-image: radial-gradient(
          rgba(15, 19, 24, 0.06) 1px,
          transparent 1px
        );
      }
    </style>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/framer-motion@11.3.19/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel" src="src/icons.jsx"></script>
    <script type="text/babel" src="src/data.jsx"></script>
    <script type="text/babel" src="src/ui.jsx"></script>
    <script type="text/babel" src="src/card.jsx"></script>
    <script type="text/babel" src="src/screens-main.jsx"></script>
    <script type="text/babel" src="src/screens-detail.jsx"></script>
    <script type="text/babel" src="src/screens-review.jsx"></script>
    <script type="text/babel" src="src/screens-mobile.jsx"></script>
    <script type="text/babel" src="src/screens-components.jsx"></script>
    <script type="text/babel" src="src/app.jsx"></script>
  </body>
</html>
