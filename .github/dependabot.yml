version: 2
updates:
  - package-ecosystem: "npm"
    directories: [ "/", "/apps/ingest", "/apps/web", "/packages/db", "/packages/parser", "/packages/shared" ]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
