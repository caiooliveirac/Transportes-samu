name: CI → Deploy

# Mesmo padrão validado em caiooliveirac/plantoes: o runner self-hosted
# É a EC2 de produção. Não há SSH-from-GH; o deploy é simplesmente
# `cd /home/ubuntu/transportes-samu && bash scripts/deploy-production.sh`
# executando localmente no runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Só um deploy por vez na mesma branch — push novo cancela job em vôo.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Gate rápido: smoke do que pode quebrar em prod (lint, typecheck,
  # build, testes do parser). Roda em PR e push para main.
  # ────────────────────────────────────────────────────────────────────
  gate:
    name: lint · typecheck · build · test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # ────────────────────────────────────────────────────────────────────
  # Deploy: apenas push em main após gate verde. O runner é a EC2,
  # então o "deploy" é só rodar o script local que cuida de install,
  # migrate, build, pm2 reload e health validation.
  # ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    needs: gate
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout into production dir
        uses: actions/checkout@v4

      - name: Run deploy script
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/deploy-production.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Actor** | @${{ github.actor }} |"
            echo "| **Public**  | https://transportes.mnrs.com.br |"
          } >> "$GITHUB_STEP_SUMMARY"
